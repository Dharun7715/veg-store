<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

<h1>🛒 Your Cart</h1>

{% for item in cart %}
    <div>
        {{ item }}
        <a href="/remove/{{ item }}">
            <button>Remove</button>
        </a>
    </div>
{% endfor %}

<h2>Total: ₹{{ total }}</h2>

<br>

<a href="/home">
    <button>Back to Shop</button>
</a>

</body>
</html>

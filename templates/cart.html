<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body style="text-align:center; font-family:Arial;">

<h2>🛒 Your Cart</h2>

<a href="/home">Back to Shop</a>

<ul>
    {% for item in cart %}
        <li>
            {{ item }}
            <a href="/remove/{{ item }}">Remove</a>
        </li>
    {% endfor %}
</ul>

</body>
</html>

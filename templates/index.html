<!DOCTYPE html>
<html>
<head>
    <title>Veg Store</title>
</head>
<body>

<h1>🥕 Veg Store</h1>

<a href="/cart">🛒 Go to Cart</a>

<h3>Products</h3>

<ul>
    {% for item, price in products.items() %}
        <li>
            {{ item }} - ₹{{ price }}
            <a href="/add_to_cart/{{ item }}">Add</a>
        </li>
    {% endfor %}
</ul>

</body>
</html>
